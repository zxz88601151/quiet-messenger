# ============================================================================
# 极简私人通讯 — Nginx HTTPS 反向代理 (Phase 2D-DEPLOYMENT)
# ----------------------------------------------------------------------------
# 约定：
#   - HTTP 80 → 301 跳 HTTPS（不承载业务）。
#   - HTTPS 443 → 后端 backend:8000（/api/v1/ 业务路由 + /health）。
#   - 正确 Forwarded / X-Forwarded-* 头（FastAPI 用 proxy-headers 读取）。
#   - 不暴露后端内部端口；不引入 WebSocket 配置（本阶段不实现 WS）。
#   - 证书：deploy/nginx/certs/fullchain.pem + privkey.pem（真实域名签发）。
#     无真实域名时：自签证书仅用于本地验证，标记为 BLOCKED BY ENVIRONMENT（不伪造 PASS）。
# ============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name _;
        # 允许 ACME 挑战（如需 certbot）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 后端路由按 API_CONTRACT 挂载在 /api/v1 前缀
        # （/api/v1/auth /api/v1/users /api/v1/friends
        #  /api/v1/conversations /api/v1/devices），/health 在根。
        # proxy_pass 不带 URI，保留原始 /api/v1/... 路径转发到后端。
        # 透传真实客户端信息（FastAPI 用 --proxy-headers 读取）。

        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
        }

        # 其余路径不处理（前端静态资源本阶段不在范围）
        location / {
            return 404;
        }
    }
}
