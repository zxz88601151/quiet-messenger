# Quiet Messenger CI
#
# 三个 job 与三个端一一对应，任何一个红了都说明 main 坏了：
# - backend : FastAPI pytest 全量（含 alembic 迁移 + 安全补丁回归测试）
# - desktop : PySide6 pytest（offscreen 无头，需先装 Qt 系统库）
# - flutter : flutter analyze + flutter test
#
# 触发：push 到 main / 任意 PR。同一分支的新提交会自动取消旧的运行。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -q

  desktop:
    name: Desktop (pytest, offscreen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 在 Linux 需要这些系统库，否则报 ImportError: libEGL.so.1
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        # 与 desktop/requirements.txt 保持一致（显式列出，避免文件缺失导致 CI 挂）
        run: pip install PySide6 requests keyring websockets pytest

      - name: Run tests
        run: pytest tests/ -q

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Must be >= 3.47: pubspec.yaml pins `sdk: ^3.12.2`, but Flutter 3.44
          # ships Dart 3.12.0, which fails version solving.
          flutter-version: "3.47.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
