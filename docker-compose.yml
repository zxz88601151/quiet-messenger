# ============================================================================
# 极简私人通讯 — Staging Compose (Phase 2D-DEPLOYMENT)
# ----------------------------------------------------------------------------
# 三服务：postgres (内部) / backend (内部 8000) / nginx (对外 443)
# 安全约定：
#   - postgres / backend 仅挂 internal 网络，不映射公网端口。
#   - 真实 secret 来自 .env（env_file），不在此文件硬编码。
#   - nginx 对外仅暴露 443 (HTTPS)；HTTP 80 仅做 301 跳转。
#   - 禁止将 8000 / 5432 映射到宿主机 0.0.0.0。
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_PG_DB:-chat_staging}
      POSTGRES_USER: ${STAGING_PG_USER:-chat_staging_user}
      POSTGRES_PASSWORD: ${STAGING_PG_PASSWORD:?STAGING_PG_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_PG_USER:-chat_staging_user} -d ${STAGING_PG_DB:-chat_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 注意：不映射 ports，5432 不暴露公网。

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内 DATABASE_URL 指向 compose 内 postgres 服务名
      DATABASE_URL: postgresql+psycopg://${STAGING_PG_USER:-chat_staging_user}:${STAGING_PG_PASSWORD:?STAGING_PG_PASSWORD must be set in .env}@postgres:5432/${STAGING_PG_DB:-chat_staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - frontend
    # 不映射 8000 到宿主机；仅 nginx 能访问。
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"      # HTTP → 301 HTTPS（不承载业务）
      - "443:443"    # HTTPS 对外
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pgdata:
